<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="Valid time sits on the relation: one closed interval, one open interval, and two --as-of reads that answer differently" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title>Valid time sits on the relation</title>
<desc>A timeline. The relation created_by to Roastery A runs from t1 to t2 and is marked superseded_by; the relation created_by to Roastery B runs from t2 with no valid_until. A dashed line at a past instant crosses only the first relation and answers Roastery A; the dashed line at now crosses only the second and answers Roastery B. Record time is noted separately: it moves when the file changes, not when the statement held.</desc>

<line x1="330" y1="84" x2="330" y2="264" stroke="#9A6700" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="620" y1="84" x2="620" y2="264" stroke="#9A6700" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="330" y="58" text-anchor="middle" fill="#9A6700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--as-of &lt;past instant&gt;</text>
<text x="330" y="76" text-anchor="middle" fill="#59636E">answers Roastery A</text>
<text x="620" y="58" text-anchor="middle" fill="#9A6700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--as-of now (default)</text>
<text x="620" y="76" text-anchor="middle" fill="#59636E">answers Roastery B</text>

<text x="110" y="112" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">created_by → Roastery A</text>
<rect x="110" y="120" width="290" height="16" rx="3" fill="#D8DEE4" stroke="#AFB8C1"/>
<text x="110" y="154" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">valid_from t₁ · valid_until t₂</text>

<line x1="400" y1="138" x2="400" y2="182" stroke="#AFB8C1" stroke-width="1.5"/>
<polygon points="396,182 404,182 400,190" fill="#AFB8C1"/>
<text x="410" y="164" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">superseded_by</text>

<text x="400" y="182" fill="#0F7A5A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">created_by → Roastery B</text>
<rect x="400" y="190" width="270" height="16" rx="3" fill="#1D9E75"/>
<polygon points="670,188 670,208 700,198" fill="#1D9E75"/>
<text x="400" y="228" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">valid_from t₂ · no valid_until</text>

<line x1="60" y1="252" x2="700" y2="252" stroke="#AFB8C1" stroke-width="1.5"/>
<polygon points="700,247 700,257 712,252" fill="#AFB8C1"/>
<circle cx="110" cy="252" r="5" fill="#1D9E75"/>
<circle cx="400" cy="252" r="5" fill="#1D9E75"/>
<circle cx="620" cy="252" r="4.25" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<text x="110" y="274" text-anchor="middle" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">t₁</text>
<text x="400" y="274" text-anchor="middle" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">t₂</text>
<text x="620" y="274" text-anchor="middle" fill="#59636E" font-size="11">now</text>
<text x="712" y="274" text-anchor="end" fill="#59636E" font-size="11">valid time</text>

<line x1="60" y1="302" x2="700" y2="302" stroke="#D8DEE4" stroke-width="1"/>
<text x="60" y="324" fill="#59636E" font-size="12">Record time is a different clock: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">created_at</tspan> and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">updated_at</tspan> say when the vault held and</text>
<text x="60" y="342" fill="#59636E" font-size="12">changed the file. Closing the first relation raises <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">updated_at</tspan>; its interval stays in the past.</text>
</svg>
