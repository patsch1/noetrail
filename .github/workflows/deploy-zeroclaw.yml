name: Publish ZeroClaw candidate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zeroclaw-candidate
  cancel-in-progress: false

jobs:
  candidate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Publish the tested main commit
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$CANDIDATE_SHA" ]; then
            echo "A newer main commit exists; skip this candidate."
            exit 0
          fi
          python3 tools/zeroclaw_candidate.py "$CANDIDATE_SHA" deploy/zeroclaw/candidate
          git config user.name github-actions\[bot\]
          git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
          git add deploy/zeroclaw/candidate
          git commit -m "ci: publish candidate $CANDIDATE_SHA"
          # Only this generated branch is replaced; main remains PR-protected.
          # Concurrency serializes publishers, and the main check rejects stale CI.
          git push --force origin HEAD:refs/heads/deploy/test
