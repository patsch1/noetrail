# Adapt namespace and labels to the deployment before applying.
#
# This policy accepts MCP only from the ZeroClaw pod and gives the fetcher only
# DNS plus public HTTP(S) egress. It does not grant access to the knowledge PVC;
# that separation belongs in the Pod/Deployment volume mounts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookmark-fetcher-egress
  namespace: REPLACE
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zeroclaw-bookmark-fetcher
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zeroclaw
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              # NAT64 (RFC 6052/8215): 64:ff9b::a9fe:a9fe is the metadata
              # service and 64:ff9b::7f00:1 is loopback behind a translator.
              - 64:ff9b::/96
              - 64:ff9b:1::/48
              - 100::/64
              - 2001:db8::/32
              # 6to4 (RFC 3056): 2002:7f00:1:: relays to 127.0.0.1.
              - 2002::/16
              - fc00::/7
              - fe80::/10
              - ff00::/8
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
